    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@500;600&family=Playfair+Display:wght@400;500&family=Poppins:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@500;600&family=Playfair+Display:wght@400;500&family=Poppins:wght@400;500&display=swap" /></noscript>
    <script>
      // Start fetching the home hero image before the app has rendered
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'; l.as = 'image'; l.href = '/images/hero.webp'; l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
    <script>
      // Show the loading screen once per browser session, and never for people who prefer reduced motion
      try {
        if (!sessionStorage.getItem('ah-splash') && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('splash')
      } catch (e) {}
    </script>
    <title>Adore Hive | Buzz with style</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Adore Hive",
        "slogan": "Buzz with style.",
        "telephone": "+917697107355",
        "address": { "@type": "PostalAddress", "addressLocality": "Indore", "addressRegion": "Madhya Pradesh", "postalCode": "452010", "addressCountry": "IN" },
        "sameAs": ["https://www.instagram.com/adore.hive"]
      }
    </script>
  </head>
  <body>
        <div id="splash" role="status" aria-busy="true" aria-label="Loading Adore Hive">
      <img src="/logo.webp" alt="" width="120" height="107" />
      <div class="track">
        <svg class="bee" viewBox="0 0 48 48" fill="none" stroke="#171313" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="18" cy="13" rx="6.5" ry="10" transform="rotate(-25 18 13)" fill="#fff" fill-opacity=".85"/><ellipse cx="29" cy="11" rx="6.5" ry="10" transform="rotate(20 29 11)" fill="#fff" fill-opacity=".85"/><ellipse cx="25" cy="30" rx="13" ry="9.5" fill="#f2c94c"/><path d="M20 21.5v17M26 20.5v19M32 22v16"/><circle cx="11" cy="30" r="5" fill="#171313"/><path d="M8 26c-2-3-4-4-6-4M11 25c-1-4-2-6-4-7"/></svg>
        <i></i>
      </div>
      <span class="sr-only-splash" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
